<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" role="img" aria-labelledby="t d">
  <title id="t">Market Stretch Terminal data flow</title>
  <desc id="d">Yahoo Finance and Wikipedia feed a scheduled GitHub Action, which writes data/market.json. The app reads that file and a service worker keeps an offline copy.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#818cf8"/></marker>
    <style>
      .bx{fill:#0e131f;stroke:#818cf8;stroke-width:1.5}
      .bg{fill:#0e131f;stroke:#34d399;stroke-width:1.5}
      .t{font:700 15px -apple-system,Segoe UI,Roboto,sans-serif;fill:#e8edf5}
      .s{font:13px -apple-system,Segoe UI,Roboto,sans-serif;fill:#8b9ab0}
      .ln{stroke:#818cf8;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="860" height="230" rx="16" fill="#06090e"/>
  <rect class="bx" x="24" y="30" width="190" height="64" rx="12"/>
  <text class="t" x="119" y="58" text-anchor="middle">Yahoo Finance</text><text class="s" x="119" y="78" text-anchor="middle">end-of-day prices, VIX</text>
  <rect class="bx" x="24" y="120" width="190" height="64" rx="12"/>
  <text class="t" x="119" y="148" text-anchor="middle">Wikipedia</text><text class="s" x="119" y="168" text-anchor="middle">index constituents</text>
  <rect class="bx" x="300" y="75" width="200" height="80" rx="12"/>
  <text class="t" x="400" y="108" text-anchor="middle">GitHub Action</text><text class="s" x="400" y="128" text-anchor="middle">weekdays after US close</text><text class="s" x="400" y="144" text-anchor="middle">scripts/update_data.py</text>
  <rect class="bg" x="586" y="30" width="250" height="64" rx="12"/>
  <text class="t" x="711" y="58" text-anchor="middle">data/market.json</text><text class="s" x="711" y="78" text-anchor="middle">committed to the repo</text>
  <rect class="bg" x="586" y="120" width="250" height="64" rx="12"/>
  <text class="t" x="711" y="148" text-anchor="middle">/app  (PWA)</text><text class="s" x="711" y="168" text-anchor="middle">reads it · works offline</text>
  <path class="ln" d="M214 62 H258 V105 H298" marker-end="url(#a)"/>
  <path class="ln" d="M214 152 H258 V125 H298" marker-end="url(#a)"/>
  <path class="ln" d="M500 115 H540 V62 H584" marker-end="url(#a)"/>
  <path class="ln" d="M711 94 V118" marker-end="url(#a)"/>
</svg>
