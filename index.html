<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDX Live Mobile Terminal</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --green: #238636;
            --red: #da3633;
            --yellow: #d29922;
            --accent: #58a6ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        h1 { font-size: 1.1rem; margin: 0; color: #fff; }
        .refresh-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 6px;
        }
        .bg-red { background: rgba(218, 54, 51, 0.2); color: #f85149; border: 1px solid var(--red); }
        .bg-yellow { background: rgba(210, 153, 34, 0.2); color: #e3b341; border: 1px solid var(--yellow); }
        .bg-green { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid var(--green); }
        
        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .metric-item {
            background: var(--bg);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .metric-label { font-size: 0.75rem; color: #8b949e; }
        .metric-val { font-size: 1.1rem; font-weight: bold; color: #fff; margin-top: 2px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 8px;
        }
        th, td {
            text-align: left;
            padding: 8px 4px;
            border-bottom: 1px solid var(--border);
        }
        th { color: #8b949e; font-weight: normal; }
    </style>
</head>
<body>

    <div class="header">
        <h1>NDX Volatility Terminal</h1>
        <button class="refresh-btn" onclick="fetchLiveData()">🔄 Refresh</button>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:bold; color:#fff;" id="indexSymbol">QQQM</span>
            <span id="lastUpdated" style="font-size:0.75rem; color:#8b949e;">Updating...</span>
        </div>
        <div class="metric-grid">
            <div class="metric-item">
                <div class="metric-label">Last Close</div>
                <div class="metric-val" id="qqqmPrice">$--.--</div>
            </div>
            <div class="metric-item">
                <div class="metric-label">Ultimate Osc (7,14,28)</div>
                <div class="metric-val" id="qqqmUO">--.--%</div>
            </div>
            <div class="metric-item">
                <div class="metric-label">RSI (14)</div>
                <div class="metric-val" id="qqqmRSI">--.--</div>
            </div>
            <div class="metric-item">
                <div class="metric-label">Drawdown ($318 Peak)</div>
                <div class="metric-val" id="qqqmDD">--.--%</div>
            </div>
        </div>
        <div id="statusBadgeContainer">
            <div class="status-badge bg-yellow">Loading Market Status...</div>
        </div>
    </div>

    <div class="card">
        <div style="font-weight:bold; color:#fff; margin-bottom: 6px;">Constituent Watchlist</div>
        <table>
            <thead>
                <tr>
                    <th>Ticker</th>
                    <th>Price</th>
                    <th>UO %</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="watchlistBody">
                <tr><td colspan="4" style="color:#8b949e;">Loading live data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const TICKERS = ['QQQM', 'AAPL', 'MSFT', 'NVDA', 'AMZN', 'GOOGL', 'META', 'TSLA'];

        async function fetchTicker(symbol) {
            // Public Yahoo Finance CORS proxy endpoint
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=60d&interval=1d`;
            const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
            const data = await response.json();
            const result = data.chart.result[0];
            const quotes = result.indicators.quote[0];
            
            const closes = quotes.close.filter(v => v !== null);
            const highs = quotes.high.filter(v => v !== null);
            const lows = quotes.low.filter(v => v !== null);

            return { symbol, closes, highs, lows };
        }

        function calculateRSI(closes, period = 14) {
            let gains = 0, losses = 0;
            for (let i = 1; i <= period; i++) {
                const diff = closes[i] - closes[i - 1];
                if (diff >= 0) gains += diff; else losses -= diff;
            }
            let avgGain = gains / period;
            let avgLoss = losses / period;

            for (let i = period + 1; i < closes.length; i++) {
                const diff = closes[i] - closes[i - 1];
                if (diff >= 0) {
                    avgGain = (avgGain * 13 + diff) / 14;
                    avgLoss = (avgLoss * 13) / 14;
                } else {
                    avgGain = (avgGain * 13) / 14;
                    avgLoss = (avgLoss * 13 - diff) / 14;
                }
            }
            const rs = avgGain / (avgLoss || 1);
            return 100 - (100 / (1 + rs));
        }

        function calculateUO(highs, lows, closes) {
            let bpSum7 = 0, trSum7 = 0;
            let bpSum14 = 0, trSum14 = 0;
            let bpSum28 = 0, trSum28 = 0;

            const len = closes.length;
            for (let i = len - 28; i < len; i++) {
                const minLowCp = Math.min(lows[i], closes[i - 1]);
                const maxHighCp = Math.max(highs[i], closes[i - 1]);
                const bp = closes[i] - minLowCp;
                const tr = maxHighCp - minLowCp;

                if (i >= len - 7) { bpSum7 += bp; trSum7 += tr; }
                if (i >= len - 14) { bpSum14 += bp; trSum14 += tr; }
                bpSum28 += bp; trSum28 += tr;
            }

            const avg7 = bpSum7 / (trSum7 || 1);
            const avg14 = bpSum14 / (trSum14 || 1);
            const avg28 = bpSum28 / (trSum28 || 1);

            return 100 * ((4 * avg7) + (2 * avg14) + avg28) / 7;
        }

        async function fetchLiveData() {
            document.getElementById('lastUpdated').innerText = 'Fetching...';
            try {
                const indexData = await fetchTicker('QQQM');
                const lastClose = indexData.closes[indexData.closes.length - 1];
                const uo = calculateUO(indexData.highs, indexData.lows, indexData.closes);
                const rsi = calculateRSI(indexData.closes);
                const dd = ((318.00 - lastClose) / 318.00) * 100;

                document.getElementById('qqqmPrice').innerText = `$${lastClose.toFixed(2)}`;
                document.getElementById('qqqmUO').innerText = `${uo.toFixed(2)}%`;
                document.getElementById('qqqmRSI').innerText = rsi.toFixed(2);
                document.getElementById('qqqmDD').innerText = `-${dd.toFixed(2)}%`;
                document.getElementById('lastUpdated').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const badgeContainer = document.getElementById('statusBadgeContainer');
                if (uo < 20.0) {
                    badgeContainer.innerHTML = `<div class="status-badge bg-red">🔴 OVERSOLD (<20%) - High-Conviction Dip Zone</div>`;
                } else if (uo < 30.0) {
                    badgeContainer.innerHTML = `<div class="status-badge bg-yellow">🟡 APPROACING OVERSOLD (<30%) - Prepare Watchlist</div>`;
                } else {
                    badgeContainer.innerHTML = `<div class="status-badge bg-green">🟢 NEUTRAL / HOLD (>30%)</div>`;
                }

                // Load watchlist tickers
                const tbody = document.getElementById('watchlistBody');
                tbody.innerHTML = '';
                
                for (let sym of TICKERS.slice(1)) {
                    try {
                        const tData = await fetchTicker(sym);
                        const p = tData.closes[tData.closes.length - 1];
                        const tUO = calculateUO(tData.highs, tData.lows, tData.closes);
                        const statusClass = tUO < 20 ? 'color:#f85149; font-weight:bold;' : (tUO < 30 ? 'color:#e3b341;' : 'color:#3fb950;');
                        const statusText = tUO < 20 ? 'Oversold' : (tUO < 30 ? 'Watch' : 'Hold');

                        tbody.innerHTML += `
                            <tr>
                                <td style="font-weight:bold; color:#fff;">${sym}</td>
                                <td>$${p.toFixed(2)}</td>
                                <td style="${statusClass}">${tUO.toFixed(1)}%</td>
                                <td style="${statusClass}">${statusText}</td>
                            </tr>
                        `;
                    } catch(e) {}
                }
            } catch (err) {
                document.getElementById('lastUpdated').innerText = 'Error loading live feed';
            }
        }

        // Initialize scan on load
        fetchLiveData();
    </script>
</body>
</html>
