name: Update market data

on:
  schedule:
    # Weekdays 22:30 UTC = 5:30 PM EST / 6:30 PM EDT, after the US close
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Build data/market.json
        run: python scripts/update_data.py
        env:
          # Optional. Only used if Yahoo and Stooq both fail for the three index ETFs.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || (git commit -m "Update market data" && git push)
